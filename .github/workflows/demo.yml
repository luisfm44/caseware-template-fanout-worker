name: Run local deployment demo
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: fanout
          POSTGRES_USER: fanout
          POSTGRES_PASSWORD: fanout-ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h localhost -U fanout -d fanout"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify and package
        env:
          FANOUT_DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/fanout
          FANOUT_DB_USER: fanout
          FANOUT_DB_PASSWORD: fanout-ci
        run: ./mvnw --batch-mode --no-transfer-progress -Ppostgres-integration -DfailIfNoTests=true verify
      - name: Run the demo workload with an in-process downstream
        env:
          FANOUT_DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/fanout
          FANOUT_DB_USER: fanout
          FANOUT_DB_PASSWORD: fanout-ci
        run: |
          report="$RUNNER_TEMP/fanout-demo.json"
          timeout 90s java -jar target/template-fanout-worker.jar --spring.profiles.active=demo --demo.report="$report"
          jq -e '
            .submitted == 7 and .completed == .submitted and
            .duplicateEffects == 0 and .appliedEffects == .submitted and
            .limit == 3 and .peakInFlight == .limit and .plannedPages == 4 and
            .dispatchAttempts == .submitted and .reconciliations == 1
          ' "$report"
          cat "$report"
      - name: Upload the demo report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fanout-demo
          path: ${{ runner.temp }}/fanout-demo.json
          if-no-files-found: error
          retention-days: 7
