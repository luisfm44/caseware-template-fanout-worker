name: Regional version selection E2E

on:
  push:
    paths:
      - 'examples/regional-version-selection/**'
      - '.github/workflows/regional-version-selection.yml'
      - '.mvn/wrapper/**'
      - 'mvnw'
      - 'mvnw.cmd'
  pull_request:
    branches: [main]
    paths:
      - 'examples/regional-version-selection/**'
      - '.github/workflows/regional-version-selection.yml'
      - '.mvn/wrapper/**'
      - 'mvnw'
      - 'mvnw.cmd'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Test and publish regional mockup report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: examples/regional-version-selection/pom.xml
      - name: Run the HTTP acceptance suite
        run: ./mvnw --batch-mode --no-transfer-progress -f examples/regional-version-selection/pom.xml -DfailIfNoTests=true clean test
      - name: Generate scenario report
        id: report
        if: ${{ !cancelled() && hashFiles('examples/regional-version-selection/target/surefire-reports/TEST-io.github.luisfm44.caseware.regional.RegionalVersionSelectionHttpTest.xml') != '' }}
        run: |
          python3 examples/regional-version-selection/tools/render_evidence.py \
            examples/regional-version-selection/target/surefire-reports/TEST-io.github.luisfm44.caseware.regional.RegionalVersionSelectionHttpTest.xml \
            examples/regional-version-selection/target/evidence
      - name: Upload HTML report and Surefire results
        id: upload
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regional-version-selection-e2e
          path: |
            examples/regional-version-selection/target/evidence/
            examples/regional-version-selection/target/surefire-reports/TEST-io.github.luisfm44.caseware.regional.RegionalVersionSelectionHttpTest.xml
          if-no-files-found: error
          retention-days: 30
      - name: Link the report in the run summary
        if: ${{ !cancelled() && steps.upload.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '## Regional version selection E2E\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '[Download the HTML report and test results](%s). Extract the archive and open `evidence/index.html`.\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
