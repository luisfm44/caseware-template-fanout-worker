name: Verify and scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prove_gate_failure:
        description: Run an isolated 100% coverage gate to verify that a failed gate fails the job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: fanout
          POSTGRES_USER: fanout
          POSTGRES_PASSWORD: fanout-ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h localhost -U fanout -d fanout"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate Maven project
        run: ./mvnw --batch-mode --no-transfer-progress validate
      - name: Report scaffold status
        if: hashFiles('src/main/java/**/*.java', 'src/test/java/**/*.java') == ''
        run: echo 'Scaffold only. No Java sources, tests, or executable JAR yet.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run tests and build executable JAR
        if: hashFiles('src/main/java/**/*.java', 'src/test/java/**/*.java') != ''
        env:
          FANOUT_DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/fanout
          FANOUT_DB_USER: fanout
          FANOUT_DB_PASSWORD: fanout-ci
        run: ./mvnw --batch-mode --no-transfer-progress -Ppostgres-integration -DfailIfNoTests=true verify
      - name: Upload JAR and test reports
        if: success() && hashFiles('src/main/java/**/*.java') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-and-test-results
          path: |
            target/template-fanout-worker.jar
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Scan Maven dependencies and tracked sources
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

  quality:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    concurrency:
      group: sonarqube-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: fanout
          POSTGRES_USER: fanout
          POSTGRES_PASSWORD: fanout-ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h localhost -U fanout -d fanout"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and collect unit and PostgreSQL coverage
        env:
          FANOUT_DB_URL: jdbc:postgresql://127.0.0.1:${{ job.services.postgres.ports[5432] }}/fanout
          FANOUT_DB_USER: fanout
          FANOUT_DB_PASSWORD: fanout-ci
        run: ./mvnw --batch-mode --no-transfer-progress -Ppostgres-integration,coverage -DfailIfNoTests=true clean verify
      - name: Analyze Java and enforce the SonarQube Quality Gate
        env:
          SONAR_HOST_URL: ${{ github.ref == 'refs/heads/main' && vars.SONAR_HOST_URL || '' }}
          SONAR_PROJECT_KEY: ${{ github.ref == 'refs/heads/main' && vars.SONAR_PROJECT_KEY || '' }}
          SONAR_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SONAR_TOKEN || '' }}
          PROVE_GATE_FAILURE: ${{ inputs.prove_gate_failure || false }}
        run: |
          if [[ "$PROVE_GATE_FAILURE" == true ]]; then
            bash scripts/run-sonarqube.sh --prove-gate-failure
          else
            bash scripts/run-sonarqube.sh
          fi
      - name: Publish the Quality Gate summary
        if: always()
        run: |
          if [[ -f target/sonar-quality/summary.md ]]; then
            cat target/sonar-quality/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage and SonarQube reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonarqube-quality
          path: |
            target/site/jacoco/
            target/sonar-quality/
          if-no-files-found: ignore
          retention-days: 14
