name: Verify and scan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validate Maven project
        run: ./mvnw --batch-mode --no-transfer-progress validate
      - name: Report scaffold status
        if: hashFiles('src/main/java/**/*.java', 'src/test/java/**/*.java') == ''
        run: echo 'Scaffold only. No Java sources, tests, or executable JAR yet.' >> "$GITHUB_STEP_SUMMARY"
      - name: Run tests and build executable JAR
        if: hashFiles('src/main/java/**/*.java', 'src/test/java/**/*.java') != ''
        run: ./mvnw --batch-mode --no-transfer-progress -DfailIfNoTests=true verify
      - name: Upload JAR and test reports
        if: success() && hashFiles('src/main/java/**/*.java') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-and-test-results
          path: |
            target/template-fanout-worker.jar
            target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Scan Maven dependencies and tracked sources
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
