name: Connected reference APIs

on:
  push:
    paths:
      - 'examples/**'
      - '.github/workflows/connected-reference-apis.yml'
      - '.mvn/wrapper/**'
      - 'mvnw'
      - 'mvnw.cmd'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**'
      - '.github/workflows/connected-reference-apis.yml'
      - '.mvn/wrapper/**'
      - 'mvnw'
      - 'mvnw.cmd'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connected:
    name: Test and report the connected mock flow
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REPORT_XML: examples/connected-reference-apis/target/surefire-reports/TEST-io.github.luisfm44.caseware.connected.ConnectedReferenceApisHttpTest.xml
      REPORT_DIR: examples/connected-reference-apis/target/evidence
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: examples/**/pom.xml

      - name: Run the connected HTTP scenarios
        run: |
          ./mvnw --batch-mode --no-transfer-progress -f examples/pom.xml \
            -pl connected-reference-apis -am -Dtest=ConnectedReferenceApisHttpTest \
            -Dsurefire.failIfNoSpecifiedTests=false clean test
          test -s "$REPORT_XML"

      - name: Generate the scenario report
        id: report
        if: ${{ !cancelled() && hashFiles(env.REPORT_XML) != '' }}
        run: |
          python3 examples/regional-version-selection/tools/render_evidence.py \
            "$REPORT_XML" "$REPORT_DIR" \
            --manifest examples/connected-reference-apis/report-scenarios.json

      - name: Upload the HTML and Surefire results
        id: upload
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: connected-reference-apis
          path: |
            ${{ env.REPORT_DIR }}/
            ${{ env.REPORT_XML }}
          if-no-files-found: error
          retention-days: 30

      - name: Link the report
        if: ${{ !cancelled() && steps.upload.outputs.artifact-url != '' }}
        env:
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          printf '## Connected reference APIs\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '[Download the HTTP scenario evidence](%s). Extract the archive and open `evidence/index.html`.\n' "$REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
