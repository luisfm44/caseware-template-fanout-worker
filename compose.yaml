services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: fanout
      POSTGRES_USER: fanout
      POSTGRES_PASSWORD: ${FANOUT_DB_PASSWORD:?Set FANOUT_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "fanout", "-d", "fanout"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
